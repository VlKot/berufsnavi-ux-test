<html lang="en">

  <style>

      height: 100%;
      margin: 0;
      padding: 0;

      display: block;
      position: fixed;
      inset: 0;
      width: 100%;

      background: #F7F1E6;

  <iframe
    id="prototype"
    title="BerufsNavi interactive prototype"
